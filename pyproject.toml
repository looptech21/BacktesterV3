[project]
name = "backtester"
version = "3.0.0"
description = "Systematic backtesting with LEAN engine, parameter sweeps, and NiceGUI interface"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=18.0",
    "numpy>=1.26",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "plotly>=6.0,<7",
    "nicegui>=2.0,<3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
backtester = "backtester.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backtester = ["gui/static/**/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
